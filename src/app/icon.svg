<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1A28" />
      <stop offset="50%" stop-color="#12263A" />
      <stop offset="100%" stop-color="#081420" />
    </linearGradient>

    <!-- Droplet Primary Vibrant Gradient -->
    <linearGradient id="dropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0EA5E9" />
      <stop offset="80%" stop-color="#0E6B73" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Inner Alert Core Glow -->
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Specular Highlight Gloss -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Droplet Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#00F2FE" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#14B8A6" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Outer Ambient Water Ripple Ring -->
  <circle cx="32" cy="38" r="18" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 2" />

  <!-- Iconic Water Droplet Silhouette -->
  <path
    d="M 32 10 
       C 32 10, 47 28, 47 38 
       A 15 15 0 0 1 17 38 
       C 17 28, 32 10, 32 10 Z"
    fill="url(#dropGrad)"
    filter="url(#dropShadow)"
  />

  <!-- Top-Left Gloss Highlight Curve -->
  <path
    d="M 32 13 
       C 30 18, 21 28, 20 37 
       C 19.5 33, 22 25, 32 13 Z"
    fill="url(#glossGrad)"
  />

  <!-- Inner Sentinel Eye / Radar Wave Arc (The "Watch" element) -->
  <path
    d="M 23 38 Q 32 30 41 38"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-opacity="0.95"
  />
  <path
    d="M 25.5 42 Q 32 37 38.5 42"
    fill="none"
    stroke="#E0F2FE"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-opacity="0.75"
  />

  <!-- Hazard Alert Beacon / Pupil -->
  <circle cx="32" cy="33" r="3.8" fill="url(#alertGrad)" />
  <circle cx="33" cy="32" r="1.2" fill="#FFFFFF" />
</svg>
